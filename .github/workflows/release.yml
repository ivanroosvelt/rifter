name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, ytdlp: yt-dlp_macos, deno: deno-aarch64-apple-darwin }
          - { os: macos-13, ytdlp: yt-dlp_macos, deno: deno-x86_64-apple-darwin }
          - { os: ubuntu-latest, ytdlp: yt-dlp_linux, deno: deno-x86_64-unknown-linux-gnu }
          - { os: windows-latest, ytdlp: yt-dlp.exe, deno: deno-x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Bundle server
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name rifter-server server.py
          mkdir -p desktop/resources/bin
          cp dist/rifter-server* desktop/resources/
          cp index.html desktop/resources/

      - name: Bundle yt-dlp, deno, ffmpeg
        working-directory: desktop
        run: |
          EXE=""; [ "${{ runner.os }}" = Windows ] && EXE=".exe"
          curl -fsSL -o "resources/bin/yt-dlp$EXE" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}"
          curl -fsSL -o deno.zip "https://github.com/denoland/deno/releases/latest/download/${{ matrix.deno }}.zip"
          unzip -o deno.zip -d resources/bin && rm deno.zip
          chmod +x resources/bin/* || true
          npm install
          node prep.js

      - name: Package
        working-directory: desktop
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ $V =~ ^[0-9] ]] || V=0.0.0 # manual runs aren't tags
          npx electron-builder --publish never -c.extraMetadata.version="$V"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: rifter-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
